services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins

    restart: unless-stopped

    ports:
      - "8081:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    group_add:
      - "999"

    environment:
      - TZ=Asia/Jerusalem

volumes:
  jenkins_home:
